{% extends "base.html" %}
{% block content %}
  <h1>
    Delete Manufacturer
  </h1>
  <p>Are you sure you want to delete this manufacturer: {{ manufacturer }}?</p>
  <p><i>This action will permanently delete the manufacturer and all associated cars.</i></p>
  <form action="" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes, delete" class="btn btn-danger">
  </form>
{% endblock %}
